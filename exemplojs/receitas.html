<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Catálogo de Receitas</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet">

</head>

<body class="bg-warning" onload="preencheCatalogo()">

<div class="container-fluid">

    <h1 class="text-center p-3">
        Catálogo de Receitas
    </h1>

    <div
        id="pnlCatalogo"
        class="d-flex flex-wrap gap-3"
    ></div>

</div>

<script>

const receitas = [

    {
        titulo: "Bolo de Chocolate",

        imagem: "https://percursosliterariosblog.com/wp-content/uploads/2020/04/p_20200405_134430_vhdr_on.jpg",

        preparo: "Misture tudo e asse.",

        ingredientes: [
            "Farinha",
            "Chocolate",
            "Ovos",
            "Leite"
        ]
    },

    {
        titulo: "Lasanha",

        imagem: "https://www.tasteofhome.com/wp-content/uploads/2025/07/Best-Lasagna_EXPS_ATBBZ25_36333_DR_07_01_2b.jpg",

        preparo: "Monte as camadas e asse.",

        ingredientes: [
            "Massa",
            "Queijo",
            "Presunto",
            "Molho"
        ]
    }
];

function getListaIngredientes(receita) {

    let texto = "<ul>";

    texto += receita.ingredientes
        .map(item => `<li>${item}</li>`)
        .reduce((total, atual) => total + atual, "");

    texto += "</ul>";

    return texto;
}

function getCard(receita) {

    return `

        <div class="card" style="width:250px">

            <img
                src="${receita.imagem}"
                class="card-img-top"
            >

            <div class="card-body">

                <h5 class="card-title">
                    ${receita.titulo}
                </h5>

                <div class="card-text">

                    ${getListaIngredientes(receita)}

                    <hr>

                    ${receita.preparo}

                </div>

            </div>

        </div>
    `;
}

function preencheCatalogo() {

    let painel =
        document.getElementById("pnlCatalogo");

    painel.innerHTML = receitas
        .map(receita => getCard(receita))
        .reduce((total, atual) => total + atual, "");
}

</script>

</body>

</html>
