<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<script src="ordenado.js"></script>

</head>

<body>

    <h1>Ordenação</h1>

    <input type="number" id="valor">

    <button onclick="add()">Adicionar</button>

    <br><br>

    <select id="algoritmo">
        <option>Bubble Sort</option>
        <option>Selection Sort</option>
        <option>Quick Sort</option>
    </select>

    <button onclick="ordenar()">Ordenar</button>

    <button onclick="misturar()">Misturar</button>

    <hr>

    <ul id="valores"></ul>

<script>

function add() {

    let campo = document.getElementById("valor");

    let lista = document.getElementById("valores");

    let node = document.createElement("li");

    let texto = document.createTextNode(campo.value);

    node.appendChild(texto);

    lista.appendChild(node);

    campo.value = "";
}

function ordenar() {

    let lista = document.getElementById("valores");

    let algoritmo = document.getElementById("algoritmo");

    let vetor = [];

    for(let i = 0; i < lista.children.length; i++) {

        vetor.push(
            eval(lista.children[i].innerHTML)
        );
    }

    switch(algoritmo.selectedIndex) {

        case 0:
            bubble_sort(vetor);
            break;

        case 1:
            selection_sort(vetor);
            break;

        case 2:
            quick_sort(vetor, 0, vetor.length - 1);
            break;
    }

    lista.innerHTML = vetor
        .map(item => `<li>${item}</li>`)
        .reduce((total, atual) => total + atual);
}

function misturar() {

    let lista = document.getElementById("valores");

    let vetor = [];

    for(let i = 0; i < lista.children.length; i++) {

        vetor.push(
            eval(lista.children[i].innerHTML)
        );
    }

    shuffle(vetor, 10);

    lista.innerHTML = vetor
        .map(item => `<li>${item}</li>`)
        .reduce((total, atual) => total + atual);
}

</script>
