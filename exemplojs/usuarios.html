<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Usuários REST</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>

</head>

<body class="container bg-warning">

    <h1 class="p-3">
        Usuários de Teste via REST
    </h1>

    <p>
        Fonte:
        <a href="https://jsonplaceholder.typicode.com/">
            JSONPlaceholder
        </a>
    </p>

    <!-- Painel principal do Vue -->
    <div id="usuarios" class="container-fluid">

        <!-- Linha de cards -->
        <div class="row">

            <!-- Card do usuário -->
            <div
                class="card col-3 p-2 m-3"
                v-for="(user,index) in users"
                :key="index"
            >

                <!-- Avatar -->
                <img
                    class="card-img-top"
                    :src="'https://i.pravatar.cc/150?img=' + (index+1)"
                >

                <!-- Corpo -->
                <div class="card-body">

                    <!-- Nome -->
                    <h5 class="card-title">
                        {{user.name}}
                    </h5>

                    <!-- Email -->
                    <p class="card-text">
                        {{user.email}}
                    </p>

                </div>

            </div>

        </div>

    </div>

<script>

new Vue({

    // Elemento principal
    el: "#usuarios",

    // Dados
    data() {

        return {

            users: []
        }
    },

    // Executa ao carregar
    mounted() {

        this.loadUsers();
    },

    // Métodos
    methods: {

        loadUsers() {

            fetch(
                "https://jsonplaceholder.typicode.com/users"
            )

            .then(res => res.json())

            .then(dados => {

                console.log(dados);

                // Preenche vetor
                this.users = dados;
            })

            .catch(erro => {

                console.log(erro);
            });
        }
    }

});

</script>

</body>
</html>
